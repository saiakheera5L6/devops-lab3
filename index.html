<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Event Registration Form</title>
</head>
<body>
    <h1>User Event Registration Form</h1>
    <form action="">
        <label for="name">Name : </label>
        <input type="text" name="name" id="name" required>
        <br>
        <label for="email">Email : </label>
        <input type="email" name="email" id="email" required>
        <br>
        <label for="phone">Phone : </label>
        <input type="tel" name="phone" id="phone">
        <br>
        <label for="gender">Gender : </label>
        <input type="text" name="gender" id="gender">
        <br>
        <label for="organizaation">Organization : </label>
        <input type="text" name="organization" id="organization">
        <br>
        <label for="attendee-type">Attendee Type : </label>
        <select name="attendee-type" id="attendee-type">
            <option value="general">General</option>
            <option value="vip">VIP</option>
            <option value="speaker">Speaker</option>
        </select>
        <br><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
